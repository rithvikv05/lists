# Local-only development configuration. Never deploy this placeholder database ID.
name = "lists-search-engine-local"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
[vars]
ENVIRONMENT = "local-catalog"
[[d1_databases]]
binding = "CATALOG_DB"
database_name = "lists-catalog-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
